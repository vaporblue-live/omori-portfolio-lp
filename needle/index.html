<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S.OMORI — Drop the Needle</title>
  <meta name="description" content="動画編集者 S.OMORI のポートフォリオ。針を落として、音楽と一緒にご覧ください。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+JP:wght@500;700;900&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="needle.js"></script>
</head>
<body>

  <header class="site-header">
    <a class="logo" href="#top">S.OMORI</a>
    <nav class="nav" aria-label="セクション">
      <a href="#about">ABOUT</a>
      <a href="#works">WORKS</a>
      <a href="#contact">CONTACT</a>
    </nav>
    <button class="sound" type="button" aria-pressed="false" aria-label="音楽を再生">
      <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="sound-label">SOUND OFF</span>
    </button>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 class="title" id="hero-title" aria-label="PORTFOLIO">
          <span class="row">
            <span class="ch w">P</span><span class="ch s">O</span><span class="ch w">R</span><span class="ch o">T</span>
          </span>
          <span class="row">
            <span class="ch y">F</span><span class="ch w">O</span><span class="ch s">L</span><span class="ch w">I</span><span class="ch o">O</span>
          </span>
        </h1>
        <p class="catalog">SO-4001 · S.OMORI · VIDEO EDITOR</p>
        <p class="tagline"><span class="phrase">最後まで</span><span class="phrase y">観たくなる</span><span class="phrase">映像を、</span><span class="phrase"><span class="o">丁寧に</span>。</span></p>
      </div>

      <div class="deck">
        <button class="record" type="button" aria-label="針を落として音楽を再生">
          <span class="vinyl" aria-hidden="true">
            <span class="grooves"></span>
            <span class="label">S.OMORI<br>SIDE A</span>
          </span>
        </button>

        <div class="sleeve" aria-hidden="true">
          <img src="images/portrait.webp" alt="" width="1254" height="1254">
          <span class="sleeve-name"><span class="w">S.</span><span class="y">OMORI</span></span>
          <span class="sleeve-cat">SO-4001 · STEREO</span>
        </div>

        <div class="tonearm" aria-hidden="true">
          <span class="pivot"></span>
          <span class="arm"><span class="head"></span></span>
        </div>
      </div>

      <p class="cue" aria-live="polite">
        <span class="cue-text">レコードをクリックして、針を落とす</span>
        <span class="cue-line" aria-hidden="true"></span>
      </p>
    </section>

    <!-- Next chapters are built in the following steps. -->
    <section id="about" class="placeholder" aria-label="ABOUT（次のステップで実装）"></section>
    <section id="works" class="placeholder" aria-label="WORKS（次のステップで実装）"></section>
    <section id="contact" class="placeholder" aria-label="CONTACT（次のステップで実装）"></section>
  </main>

</body>
</html>
